[project]
name = "solo-backend"
version = "0.1.0"
description = "Voice-First AI Workspace — backend (FastAPI + SQLite)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
