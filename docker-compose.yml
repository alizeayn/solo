# Voice-First AI Workspace — single-service deployment.
#
#   docker compose up -d --build
#   docker compose logs -f
#
# The named volume `solo-data` holds the SQLite database, the encryption key,
# the encrypted secrets and every workspace, so it survives image rebuilds.

services:
  solo:
    build:
      context: .
      dockerfile: Dockerfile
    image: solo-workspace:local
    container_name: solo-workspace
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      APP_ENV: "production"
      APP_DATA_DIR: /data
      APP_PORT: "8080"
      FRONTEND_DIST: /app/frontend/dist
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

    volumes:
      - solo-data:/data
      # One-time bootstrap password written by install.sh. The application
      # consumes and deletes it on first start. Safe to omit when starting
      # without install.sh: the UI then shows first-run setup instead.
      - ./initial-admin-password:/data/initial-admin-password

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    security_opt:
      - no-new-privileges:true

volumes:
  solo-data:
    name: solo-data
